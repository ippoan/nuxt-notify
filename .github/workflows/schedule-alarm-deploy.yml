name: schedule-alarm DO worker

# notify-schedule-alarm は ScheduleAlarmDO (Durable Object + new_sqlite_classes
# migration) を定義する独立 worker (Refs ippoan/rust-alc-api#550, #102)。
#
# DO migration を含む version は `wrangler versions upload` では deploy できない
# (Cloudflare error 10211: migration は non-versioned deployment 必須。未 deploy の
# 新規 worker では "worker does not exist" になる — v0.0.30 tag run で実証)。よって
# この worker だけは frontend-ci.yml を使わず bespoke に `wrangler deploy` する。
# frontend-ci の release script は `${CMD//wrangler deploy/wrangler versions upload}`
# で global 置換するため、frontend-ci 経由にすると migration deploy が壊れる
# (durable-object-worker skill / nuxt-items items-sync-deploy.yml と同パターン)。
#
# pull_request: typecheck + test (coverage 100% gate) のみ実行し deploy は skip。
# push(main/tag) / workflow_dispatch: 上記 gate に加えて deploy を実行。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'workers/schedule-alarm/**'
      - '.github/workflows/schedule-alarm-deploy.yml'
  pull_request:
    paths:
      - 'workers/schedule-alarm/**'
      - '.github/workflows/schedule-alarm-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/schedule-alarm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # vitest.config.ts の coverage.thresholds=100 で src/logic.ts / src/secret.ts
      # (pure ロジック) が 100% 未満なら non-zero exit → gate fail。
      - name: Test (coverage 100% gate)
        run: npx vitest run --coverage

      # tag push (v*) → prod、それ以外 (main push / workflow_dispatch) → staging。
      # DO migration があるため versions upload ではなく wrangler deploy を使う。
      # pull_request では deploy しない (gate のみ)。
      - name: Deploy (staging)
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        run: npx wrangler deploy --env staging --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy (production)
        if: github.event_name != 'pull_request' && github.ref_type == 'tag'
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # staging deploy 後、認証なし PUT が 401 で返ることを確認する fail-closed smoke。
  # secret 値そのものは CI に置かない (値レスで検証できる項目だけ見る):
  #   401 = worker 稼働 + INTERNAL_SHARED_SECRET binding 解決 OK (fail-closed 動作)
  #   503 = Secrets Store binding が空 (= 投入漏れ / drift) → loud fail
  smoke-staging-fail-closed:
    name: Smoke fail-closed on staging
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: PUT /alarms without secret expects 401
        run: |
          set -eu
          http=$(curl -sS -o /tmp/body -w "%{http_code}" -X PUT \
            "https://alarm.notify-staging.ippoan.org/alarms/00000000-0000-0000-0000-000000000000" \
            -H "Content-Type: application/json" \
            --data-binary '{"fire_at":"2027-01-01T00:00:00Z"}')
          echo "HTTP $http"
          head -c 300 /tmp/body || true
          echo
          if [ "$http" = "503" ]; then
            echo "::error::INTERNAL_SHARED_SECRET binding is empty on staging — check CF Secrets Store entry INTERNAL_SHARED_SECRET (secrets-inventory get_drift)"
            exit 1
          fi
          if [ "$http" != "401" ]; then
            echo "::error::expected 401 (fail-closed), got HTTP $http"
            exit 1
          fi
          echo "::notice::fail-closed OK (401 without secret)"
