name: Realtime Bus Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'workers/realtime-bus/**'
      - '.github/workflows/realtime-bus-deploy.yml'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'workers/realtime-bus/**'
      - '.github/workflows/realtime-bus-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'worker'
      working_directory: 'workers/realtime-bus'
      cache_dependency_path: 'workers/realtime-bus/package-lock.json'
      install_command: 'npm install'
      typecheck_command: 'npx tsc --noEmit'
      # vitest はまだ追加してない (Phase 2.5 の最小スコープ)。
      # E2E は wscat + curl で staging 確認 → 後追いで unit (Phase 2.6)。
      test_command: 'echo "no tests yet"'
      deploy_staging_script: 'npx wrangler deploy --env staging --config wrangler.toml'
      deploy_release_script: 'npx wrangler deploy --config wrangler.toml'
      has_integration: false
      has_tests: true
      has_deploy: true
      has_staging_deploy: true
      # wrangler.toml が [[secrets_store_secrets]] を含むので secret-verify を opt-in
      # (Refs ippoan/ci-workflows#50 で wrangler Secrets Store binding 利用時の gate になった)
      gcp_secret_verify_project: cloudsql-sv
      gcp_secret_verify_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_secret_verify_sa: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
    secrets: inherit
