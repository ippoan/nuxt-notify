name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'nuxt'
      install_command: 'npm install'
      npm_scope: '@ippoan'
      use_auth_client_dev: true
      # monorepo 3 unit の app worker。deploy の pending/traffic-report を
      # per-worker (`traffic::<repo>::nuxt-notify`) で記録させ、Release Wave の
      # Pending releases / flip を unit 単位で機能させる (Refs ippoan/ci-dashboard#427)。
      report_worker_name: nuxt-notify
      # rust の文書の一覧・search を叩く live のテストは、口が alc-notify-worker へ移り rust から消えるので消した
      # (W8c-1、Refs ippoan/rust-alc-api#680)。tests/integration/ が空のため integration を止める
      has_integration: false
      integration_test_command: 'npx vitest run tests/integration/'
      integration_env: 'API_BASE_URL=http://localhost:18080'
      # Release Wave compatibility: integration test green 時に
      # 「nuxt-notify が rust-alc-api の現 prod image を相手に test した」ことを
      # ci-dashboard に記録する (Refs ippoan/ci-dashboard#157)。
      compat_backend_repo: ippoan/rust-alc-api
      # docker-compose.test.yml は ${API_IMAGE:-…:dev} で backend image を読む。
      # frontend-ci がここに記録対象 SHA (ghcr.io/ippoan/rust-alc-api:<sha>) を
      # 注入し、test した image == 記録 SHA を保証する (truthful 突合)。
      compat_backend_image_env: API_IMAGE
    secrets: inherit
