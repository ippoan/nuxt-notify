name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      # staging deploy 後に、この frontend が実際に呼ぶ staging の CF Worker の SHA を tested として
      # ci-dashboard に報告する (Refs ippoan/ci-dashboard#520)。呼ぶ証拠のある worker だけを並べる。
      compat_staging_backends: 'ippoan/alc-notify-worker,ippoan/alc-lineworks-worker'
      project_type: 'nuxt'
      install_command: 'npm install'
      npm_scope: '@ippoan'
      use_auth_client_dev: true
      # monorepo 3 unit の app worker。deploy の pending/traffic-report を
      # per-worker (`traffic::<repo>::nuxt-notify`) で記録させ、Release Wave の
      # Pending releases / flip を unit 単位で機能させる (Refs ippoan/ci-dashboard#427)。
      report_worker_name: nuxt-notify
    secrets: inherit
