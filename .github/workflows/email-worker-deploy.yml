name: Email Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'workers/email-receiver/**'
      - '.github/workflows/email-worker-deploy.yml'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'workers/email-receiver/**'
      - '.github/workflows/email-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'worker'
      working_directory: 'workers/email-receiver'
      # monorepo unit worker。pending/traffic-report を per-worker
      # (`traffic::<repo>::notify-email-receiver`) で記録 (Refs ippoan/ci-dashboard#427)。
      report_worker_name: notify-email-receiver
      cache_dependency_path: 'workers/email-receiver/package-lock.json'
      install_command: 'npm ci'
      typecheck_command: 'npx tsc --noEmit'
      test_command: 'npx vitest run'
      # working_directory が反映されない / wrangler が root の wrangler.jsonc を拾う
      # ケースを避けるため --config を明示。
      deploy_staging_script: 'npx wrangler deploy --env staging --config wrangler.toml'
      deploy_release_script: 'npx wrangler deploy --config wrangler.toml'
      has_integration: false
      has_tests: true
      has_deploy: true
      has_staging_deploy: true
      # wrangler.toml が [[secrets_store_secrets]] を含むので secret-verify を opt-in
      # (Refs ippoan/ci-workflows#50 で wrangler Secrets Store binding 利用時の gate になった)
      # 注: frontend-ci.yml は wrangler_path 入力を持たないため (= startup_failure
      # になる) ここでは指定しない。secret-verify-gcp は autodetect で root の
      # wrangler.jsonc を読むが、root 側に "secrets": {"required": []} が宣言済み
      # なので gate は pass する (Nuxt frontend は実 secret を持たない設計)。
      # ippoan/ci-workflows に wrangler_path pass-through を追加したら、その時点で
      # worker の toml を直接参照する形に切り替える。
      gcp_secret_verify_project: cloudsql-sv
      gcp_secret_verify_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_secret_verify_sa: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
    secrets: inherit
