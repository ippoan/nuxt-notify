name: Email Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'workers/email-receiver/**'
      - '.github/workflows/email-worker-deploy.yml'
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'workers/email-receiver/**'
      - '.github/workflows/email-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'worker'
      working_directory: 'workers/email-receiver'
      cache_dependency_path: 'workers/email-receiver/package-lock.json'
      install_command: 'npm ci'
      typecheck_command: 'npx tsc --noEmit'
      test_command: 'npx vitest run'
      # deploy_*_script を明示指定して --config wrangler.toml を必ず読ませる。
      # 直前に pwd / ls をログに出して CWD と config 解決を可視化。
      deploy_staging_script: 'pwd && ls && npx wrangler deploy --env staging --config wrangler.toml'
      deploy_release_script: 'pwd && ls && npx wrangler deploy --config wrangler.toml'
      has_integration: false
      has_tests: true
      has_deploy: true
      has_staging_deploy: true
    secrets: inherit
