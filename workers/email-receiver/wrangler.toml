name = "notify-email-receiver"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "24b45709d060d957340180e995f0d373"

# Worker のリクエスト/イベントログを Cloudflare Dashboard の Observability タブに保存。
# silent drop が多い Email Worker ではログが無いと挙動が見えないため必須。
[observability]
enabled = true
head_sampling_rate = 1.0

# 本番 Worker は zone catch-all で *@ippoan.org を全て受け、host で分岐:
#   tenant-{short_id}@notify.ippoan.org         → binding NOTIFY (alc-notify) の POST /api/notify/ingest
#   tenant-{short_id}@notify-staging.ippoan.org → binding NOTIFY_STAGING (alc-notify-staging)
# それ以外の host / 不正な local-part (= "tenant-{short_id}" 形式でない) は silent drop。
#
# tenant 識別は body の `tenant_short_id` で alc-notify-worker が `tenants.short_id` から解決する。
# 呼び手の認証は Service Binding だけ (共有の秘密 NOTIFY_WORKER_SECRET は廃止。W8c-2、Refs ippoan/rust-alc-api#680)。
# alc-notify は workers.dev も route も持たず、auth-worker の振り分け表にも ingest は載らないので、届くのはこの binding だけ。

[[services]]
binding = "NOTIFY"
service = "alc-notify"

[[services]]
binding = "NOTIFY_STAGING"
service = "alc-notify-staging"

[vars]
PROD_HOST = "notify.ippoan.org"
STAGING_HOST = "notify-staging.ippoan.org"

# staging Worker (notify-email-receiver-staging) は CI 都合で deploy はされるが
# Email Routing の catch-all は1つしか持てないので実質受信しない。
# 手元 wrangler dev / canary 用途のみ想定。staging の host を本番の側 (NOTIFY) として受ける。
[env.staging]
name = "notify-email-receiver-staging"

[[env.staging.services]]
binding = "NOTIFY"
service = "alc-notify-staging"

[[env.staging.services]]
binding = "NOTIFY_STAGING"
service = "alc-notify-staging"

[env.staging.vars]
PROD_HOST = "notify-staging.ippoan.org"
STAGING_HOST = "notify-staging.ippoan.org"
