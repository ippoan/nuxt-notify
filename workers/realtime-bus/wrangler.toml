name = "notify-realtime-bus"
main = "src/index.ts"
compatibility_date = "2026-04-01"
account_id = "24b45709d060d957340180e995f0d373"

# 本番ルート: realtime.notify.ippoan.org
# rust-alc-api (NOTIFY_REDACT_BROADCAST_URL) → /broadcast
# admin ブラウザ (Sec-WebSocket-Protocol JWT) → /subscribe
# 注: routes は必ず [observability] より前に書く (後に書くと TOML 上
# observability 配下のキーと解釈され wrangler が黙って落とす)。
routes = [
  { pattern = "realtime.notify.ippoan.org", custom_domain = true }
]

# Worker のリクエスト/イベントログを Cloudflare Dashboard の Observability タブに保存。
# /broadcast 到着時刻と DO fan-out 件数を計測するため (Refs #71)。
# observability は inheritable key なので env.staging にも継承される。
[observability]
enabled = true
head_sampling_rate = 1.0

[durable_objects]
bindings = [
  { name = "REDACT_BUS", class_name = "RedactBus" }
]

[[migrations]]
tag = "v1"
new_classes = ["RedactBus"]

# 必須 secret (デプロイ前に投入):
#   wrangler secret put JWT_SECRET                        # rust-alc-api と同値
#   wrangler secret put JWT_SECRET --env staging
#
# NOTIFY_REDACT_BROADCAST_SECRET は CF Secrets Store binding 経由
# (Refs ippoan/rust-alc-api#354)。値の更新は GCP Secret Manager に投入 →
# secrets-inventory が CF に伝播。`wrangler secret put` は使わない
# (= per-worker env var だと secrets-inventory get_drift から見えない
# false negative リスクがあるため)。

[[secrets_store_secrets]]
binding = "NOTIFY_REDACT_BROADCAST_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "notify-redact-broadcast-secret"

[env.staging]
name = "notify-realtime-bus-staging"
routes = [
  { pattern = "realtime.notify-staging.ippoan.org", custom_domain = true }
]

[env.staging.durable_objects]
bindings = [
  { name = "REDACT_BUS", class_name = "RedactBus" }
]

[[env.staging.secrets_store_secrets]]
binding = "NOTIFY_REDACT_BROADCAST_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "notify-redact-broadcast-secret-staging"
