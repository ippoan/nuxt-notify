name = "notify-schedule-alarm"
main = "src/index.ts"
compatibility_date = "2026-04-01"
account_id = "24b45709d060d957340180e995f0d373"

# Worker のリクエスト/イベントログを Cloudflare Dashboard の Observability タブに保存。
# alarm 発火・retry・fire 結果の追跡用 (Refs ippoan/rust-alc-api#550)。
# observability は inheritable key なので env.staging にも継承される。
[observability]
enabled = true
head_sampling_rate = 1.0

# 本番ルート: alarm.notify.ippoan.org
# rust-alc-api (SCHEDULE_ALARM_URL) → PUT/DELETE /alarms/{schedule_id}
routes = [
  { pattern = "alarm.notify.ippoan.org", custom_domain = true }
]

[durable_objects]
bindings = [
  { name = "SCHEDULE_ALARM", class_name = "ScheduleAlarmDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduleAlarmDO"]

# alarm() 発火時の fire 呼び出しは auth-worker (service binding) に OIDC mint を
# 委譲する (/alc-internal-proxy、aud=alc-api-internal)。公開 URL を経由しない。
[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"

# 専用 secret は持たず、既存の INTERNAL_SHARED_SECRET を再利用する (user 判断
# 2026-07-10、Refs ippoan/rust-alc-api#550)。同じ 1 binding を
#   - 入口: rust-alc-api からの `X-Internal-Shared-Secret` 検証
#   - 出口: auth-worker /alc-internal-proxy への `X-Alc-Proxy-Secret`
# の両方に使う。entry は alc-app / carins / dtako-logs / nuxt-notify frontend と
# 物理共有 (prod/staging 統合済み)。値の rotate は secrets-inventory 経由
# (`wrangler secret put` は使わない)。

[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

[env.staging]
name = "notify-schedule-alarm-staging"
routes = [
  { pattern = "alarm.notify-staging.ippoan.org", custom_domain = true }
]

[env.staging.durable_objects]
bindings = [
  { name = "SCHEDULE_ALARM", class_name = "ScheduleAlarmDO" }
]

[[env.staging.services]]
binding = "AUTH_WORKER"
service = "auth-worker-staging"

[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"
